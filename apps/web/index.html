<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="description" content="友達と遊ぶプレス・ユア・ラック カードゲーム「ラッキーセブン」" />
    <meta name="format-detection" content="telephone=no" />
    <!-- ホーム画面に追加したときとネイティブ包装時に、全画面・暗いステータスバーで開く -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ラッキー7" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ラッキーセブン</title>
    <script>
      /* 最初の描画より前に、保存してある見た目のテーマを立てる（一瞬ちらつかせないため）。
         色そのものは CSS 側（:root[data-theme=…]）にある。数字色は src/lib/theme.ts が後から足す。 */
      (function () {
        var themes = { salon: 1, wa: 1, candy: 1, arcade: 1, picnic: 1 };
        var light = { wa: '#efe6d2', candy: '#fff7ed', picnic: '#f7f0e0' };
        var dark = { salon: '#0a0e1a', arcade: '#05060b' };
        var id = 'salon';
        try {
          var saved = localStorage.getItem('lucky7:theme');
          if (saved && themes[saved]) id = saved;
        } catch (e) {
          /* ignore */
        }
        document.documentElement.setAttribute('data-theme', id);
        var color = light[id] || dark[id];
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && color) m.setAttribute('content', color);
        if (light[id]) {
          var s = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (s) s.setAttribute('content', 'default');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
