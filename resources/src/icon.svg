<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="glow" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#1e7a52" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#124a36" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="18%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa9"/>
      <stop offset="36%" stop-color="#f2c14e"/>
      <stop offset="72%" stop-color="#dda634"/>
      <stop offset="100%" stop-color="#bb841f"/>
    </linearGradient>
    <linearGradient id="cardface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2c52"/>
      <stop offset="100%" stop-color="#121a33"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#0a0e1a"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 背後に扇状に広がる 3 枚のネイビーのカード -->
  <g opacity="0.92">
    <g transform="rotate(-19 512 980)" opacity="0.72">
      <rect x="362" y="286" width="300" height="470" rx="34" fill="url(#cardface)"/>
      <rect x="374" y="298" width="276" height="446" rx="24" fill="none" stroke="#33487e" stroke-width="5" opacity="0.65"/>
    </g>
    <g transform="rotate(19 512 980)" opacity="0.72">
      <rect x="362" y="286" width="300" height="470" rx="34" fill="url(#cardface)"/>
      <rect x="374" y="298" width="276" height="446" rx="24" fill="none" stroke="#33487e" stroke-width="5" opacity="0.65"/>
    </g>
    <g>
      <rect x="362" y="286" width="300" height="470" rx="34" fill="url(#cardface)"/>
      <rect x="374" y="298" width="276" height="446" rx="24" fill="none" stroke="#41598f" stroke-width="5" opacity="0.85"/>
    </g>
  </g>

  <!-- 大きな金色の 7 -->
  <g>
    <text x="512" y="694" text-anchor="middle"
          font-family="Futura, 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="700" font-size="560" fill="#000000" opacity="0.5"
          transform="translate(8 16)">7</text>
    <text x="512" y="694" text-anchor="middle"
          font-family="Futura, 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="700" font-size="560" fill="url(#gold)">7</text>
  </g>
</svg>
